# Describes the AngleOS service on Render (Singapore, free plan).
# The service was created through Render directly; this file documents the settings.
services:
  - type: web
    name: angleos
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false   # set in the Render dashboard, never in this file
      - key: ADMIN_EMAIL
        sync: false
      - key: SETUP_CODE
        sync: false
